server:
  port: 8080
spring:
  application:
    name: users
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres-svc:5432/postgres?sslmode=disable&connectTimeout=10}
    username: postgres
    password: postgres
  jpa:
    show-sql: false
    hibernate.ddl-auto: none
    database: POSTGRESQL
springdoc:
  show-actuator: true

users:
  service:
    url: http://users-svc:8080

security:
  service:
    url: http://security-svc:8080